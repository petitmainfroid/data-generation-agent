[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "data-generation-agent"
version = "0.1.0"
description = "Harnessed question review and data-generation agent tools."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=9.0"]

[project.scripts]
data-agent = "data_generation_agent.cli:main"
lao-quality-review = "data_generation_agent.tools.quality_review:main"
lao-difficulty-prescreen = "data_generation_agent.tools.difficulty_prescreen:main"
lao-gap-difficulty-review = "data_generation_agent.tools.legacy_gap_difficulty_review:main"
consistency-review = "data_generation_agent.tools.consistency_review:main"
answer-synthesis = "data_generation_agent.tools.answer_synthesis:main"
qwen-passrate-review = "data_generation_agent.tools.qwen_passrate_review:main"
final-gate = "data_generation_agent.tools.final_gate:main"
question-generation = "data_generation_agent.tools.question_generation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"data_generation_agent.harness" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
