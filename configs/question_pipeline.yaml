schema_version: question_pipeline.v1
pipeline_id: question_generation_audit_v1
full_pipeline_enabled: false
on_missing_stage: BLOCKED_NOT_IMPLEMENTED
on_stage_error: QUARANTINED_TOOL_ERROR

stages:
  - stage_id: quality_review
    order: 10
    tool: lao_quality_review@1.1.0
    implementation_status: ready
    enabled: true
    pass_condition:
      status: COMPLETED
      decision: ACCEPT

  - stage_id: difficulty_prescreen
    order: 20
    tool: lao_difficulty_prescreen@1.1.0
    implementation_status: ready
    enabled: true
    pass_condition:
      status: COMPLETED
      decision: HARD
      gate_decision: PASS

  - stage_id: consistency_review
    order: 30
    tool: consistency_review@1.0.0
    implementation_status: ready
    enabled: true
    pass_condition:
      status: COMPLETED
      decision: PASS

  - stage_id: answer_synthesis
    order: 40
    tool: answer_synthesis@1.0.0
    implementation_status: ready
    enabled: true
    pass_condition:
      status: COMPLETED
      decision: SYNTHESIZED

  - stage_id: qwen_passrate_review
    order: 50
    tool: qwen_passrate_review@1.0.0
    implementation_status: ready
    enabled: true
    policy:
      requested_trials: 5
      minimum_valid_trials: 3
      target_passrate_min: 0.2
      target_passrate_max: 0.8
      qwen_answer_max_tokens: 32768
      judge_model: deepseek-v4-flash
      judge_max_tokens: 2048
      judge_concurrency: 20

  - stage_id: final_gate
    order: 60
    tool: final_gate@1.0.0
    implementation_status: ready
    enabled: true
    required_stages:
      - quality_review
      - difficulty_prescreen
      - consistency_review
      - answer_synthesis
      - qwen_passrate_review
    policy:
      policy_id: hard_question_final_gate
      version: "1.0.0"
      require_same_revision: true
      require_same_policy_digest: true
      require_pinned_tool_versions: true

dataset_policies:
  hard_question_v1:
    difficulty_prescreen:
      allowed_decisions: [HARD]
      required_gate_decision: PASS
    qwen_passrate_review:
      requested_trials: 5
      minimum_valid_trials: 3
      target_passrate_min: 0.2
      target_passrate_max: 0.8
